name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y
          $iscc_dir = (Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)", "C:\tools", "C:\ProgramData\chocolatey" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          if ($iscc_dir) {
            Write-Host "Found ISCC.exe in: $iscc_dir"
            echo $iscc_dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "ISCC.exe not found after installing innosetup!"
            exit 1
          }

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Executable & Package Release
        run: |
          python tools/package_release.py

      - name: Verify Setup Installer Exists
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "VoiceTTSr_Setup_*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "CRITICAL: VoiceTTSr_Setup installer was not generated in dist/!"
            exit 1
          }
          Write-Host "Installer verified successfully: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoiceTTSr_Setup_*.exe
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
